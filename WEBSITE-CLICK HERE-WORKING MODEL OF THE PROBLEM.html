<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Basket | Student Essentials</title>
<style>
:root{--ink:#172b32;--muted:#66777a;--teal:#176a68;--teal2:#dcefeb;--paper:#f7f5ef;--white:#fff;--gold:#d9a441;--line:#e4e6df;--red:#a44037;--green:#2d765a;--shadow:0 14px 35px #203f3a12}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}a{color:var(--teal)}.topline{height:7px;background:linear-gradient(90deg,var(--teal) 0 68%,var(--gold) 68%)}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.nav{max-width:1120px;margin:auto;display:flex;align-items:center;gap:22px;padding:14px 24px}.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-weight:700;font-size:19px;letter-spacing:-.4px}.brandmark{width:34px;height:34px;border-radius:11px;background:var(--teal);color:white;display:grid;place-items:center;font-weight:bold}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.8px;text-transform:uppercase}.navbtn{background:none;color:var(--muted);padding:8px 10px;border-radius:8px}.navbtn.active,.navbtn:hover{background:var(--teal2);color:var(--teal)}.cart-pill{background:var(--ink);color:#fff;border-radius:20px;padding:7px 13px;font-size:13px}.shell{max-width:1120px;margin:auto;padding:28px 24px 55px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:center;background:#e8f1ec;border-radius:20px;padding:30px 34px;margin:4px 0 28px;overflow:hidden}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;color:var(--teal);font-size:11px;font-weight:bold}.hero h1{font-size:34px;line-height:1.1;letter-spacing:-1px;margin:10px 0}.hero p{max-width:510px;color:#506469;margin:8px 0 18px}.hero-note{background:#fff;border:1px solid #d8e7df;border-radius:14px;padding:16px 18px;transform:rotate(1deg);box-shadow:var(--shadow)}.hero-note strong{display:block;font-size:14px}.hero-note span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.stamp{font-size:31px;margin-bottom:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #d7ded8;border-radius:9px;background:white;padding:10px 12px;color:var(--ink)}.toolbar input{flex:1;min-width:190px}.btn{background:var(--teal);color:#fff;border-radius:9px;padding:10px 15px;font-weight:600}.btn:hover{background:#105553}.btn.ghost{background:#e8f1ec;color:var(--teal)}.btn.subtle{background:#f1f2ee;color:var(--ink)}.btn.danger{background:#fff0ed;color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:24px 0 12px}.section-head h2{font-size:20px;margin:0;letter-spacing:-.4px}.section-head p{margin:2px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column;min-height:205px;box-shadow:0 5px 18px #263b3508}.product-art{height:70px;border-radius:10px;background:#eff4ef;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:12px}.tag{display:inline-block;border-radius:12px;background:#f6f0e3;padding:3px 8px;color:#8a6724;font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:bold}.product h3{font-size:16px;margin:7px 0 3px}.product p{font-size:12px;color:var(--muted);margin:0 0 10px}.product-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}.price{font-weight:bold;font-size:17px}.stock{font-size:11px;color:var(--green)}.layout{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:15px}.panel h2,.panel h3{margin:0 0 12px}.cart-row,.order-row{border-top:1px solid var(--line);padding:12px 0;display:flex;align-items:center;gap:12px}.cart-row:first-of-type,.order-row:first-of-type{border-top:0}.grow{flex:1}.muted{color:var(--muted);font-size:13px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:25px;height:25px;border-radius:7px;background:#eef3ef;color:var(--teal);font-weight:bold}.total-line{display:flex;justify-content:space-between;margin:6px 0;color:var(--muted);font-size:13px}.total-line.grand{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;color:var(--ink);font-weight:bold;font-size:16px}.empty{color:var(--muted);text-align:center;padding:24px}.badge{background:var(--teal2);color:var(--teal);padding:4px 9px;border-radius:12px;font-size:11px;font-weight:bold}.status{color:var(--green);font-size:12px;font-weight:bold}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:12px;font-weight:bold;color:#42565a}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:80px;resize:vertical}.wide{grid-column:1/-1}.order-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{display:flex;gap:5px;margin:12px 0}.step{height:5px;flex:1;border-radius:5px;background:#e3e8e3}.step.done{background:var(--teal)}.notice{font-size:12px;color:var(--muted);background:#f5f6f1;border-radius:9px;padding:10px;margin:10px 0}.faq{border-top:1px solid var(--line);padding:12px 0}.faq:first-of-type{border:0}.faq strong{display:block;font-size:14px}.faq p{margin:4px 0 0;color:var(--muted);font-size:13px}.review{border-top:1px solid var(--line);padding:10px 0}.stars{color:#c28d29;letter-spacing:2px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172b32;color:#fff;padding:11px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:12}.modal-wrap{position:fixed;inset:0;background:#12272ab0;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(460px,100%);background:white;border-radius:16px;padding:24px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}.modal h2{margin:0 0 4px}.modal .field{margin-top:12px}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}.hidden{display:none!important}footer{padding:22px 0 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:30px;display:flex;justify-content:space-between;gap:20px}#viewTitle{display:none}.user-chip{font-size:12px;color:var(--muted);white-space:nowrap}
@media(max-width:740px){.nav{gap:5px;padding:10px}.brand{font-size:16px}.navbtn{padding:7px 6px;font-size:12px}.shell{padding:18px 13px 35px}.hero{grid-template-columns:1fr;padding:23px}.hero h1{font-size:29px}.hero-note{display:none}.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.user-chip{display:none}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.navbtn:nth-of-type(4){display:none}.section-head{align-items:start;flex-direction:column}.product{min-height:180px}}
</style>
</head>
<body>
<div class="topline"></div>
<header><nav class="nav"><div class="brand"><div class="brandmark">B</div><div>Campus Basket<small>student essentials, nearby</small></div></div><span id="userChip" class="user-chip"></span><button class="navbtn active" data-view="shop">Shop</button><button class="navbtn" data-view="orders">My orders</button><button class="navbtn" data-view="profile">Profile</button><button class="navbtn" data-view="help">Help</button><button class="cart-pill" data-view="shop">Basket <span id="cartCount">0</span></button><button class="navbtn" id="switchAccount">Switch account</button></nav></header>
<main class="shell"><div id="app"></div><footer><span>Campus Basket · Software Development Fundamentals · Pranaav Jena</span><span>25ETMC412501 · B.Tech MnC · 2025-2029</span></footer></main>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
/* Campus Basket: a single-page class project using browser storage. */
const STORAGE_KEY='campusBasket_v1';
const products=[
 {id:'NB01',name:'Graph notebook',category:'Stationery',price:85,stock:12,icon:'A4',note:'A4 · 160 pages'},
 {id:'CL02',name:'Lab file folder',category:'Lab supplies',price:120,stock:8,icon:'LAB',note:'Hard cover · 2 pockets'},
 {id:'CA03',name:'Scientific calculator',category:'Study tools',price:490,stock:5,icon:'123',note:'Everyday maths model'},
 {id:'PC04',name:'USB-C cable',category:'Tech basics',price:180,stock:9,icon:'USB',note:'1 metre · braided'},
 {id:'BT05',name:'Steel water bottle',category:'Daily use',price:260,stock:7,icon:'H₂O',note:'750 ml · screw cap'},
 {id:'ST06',name:'Sticky note set',category:'Stationery',price:65,stock:16,icon:'NOTE',note:'Four colours · 200 sheets'}
];
const fresh=()=>({users:{'student@campus.test':{name:'Pranaav Jena',email:'student@campus.test',password:'Campus123',phone:'',address:''}},orders:[],reviews:[],cart:{},lastOrder:0});
function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||fresh()}catch(e){return fresh()}}
let db=load(), currentEmail='student@campus.test', currentView='shop', toastTimer;
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}
const money=n=>'₹'+Number(n).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2500)}
function user(){return db.users[currentEmail]}
function cartItems(){return Object.entries(db.cart).map(([id,q])=>({product:products.find(p=>p.id===id),qty:q})).filter(x=>x.product)}
function subtotal(){return cartItems().reduce((a,x)=>a+x.product.price*x.qty,0)}
function total(){return subtotal()+Math.round(subtotal()*.05*100)/100}
function setView(view){currentView=view;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));document.getElementById('switchAccount').addEventListener('click',signIn);
function render(){document.getElementById('userChip').textContent=user()?`Signed in as ${user().name.split(' ')[0]}`:'';document.getElementById('cartCount').textContent=Object.values(db.cart).reduce((a,b)=>a+b,0);let root=document.getElementById('app');root.innerHTML=currentView==='shop'?shopView():currentView==='orders'?ordersView():currentView==='profile'?profileView():helpView();bind()}
function shopView(){return `<section class="hero"><div><div class="eyebrow">A little help for a busy week</div><h1>Forgot the folder?<br>We have a basket for that.</h1><p>Simple campus basics for lecture days, lab work and the trip back to your room. Add what you need and see the full price before placing a demo order.</p><button class="btn" id="browseBtn">Browse today's shelf</button></div><div class="hero-note"><div class="stamp">✎</div><strong>Pranaav's campus shelf</strong><span>Small things that save a last-minute shop run.</span><span>Demo sign-in: student@campus.test</span></div></section><div class="section-head"><div><h2>On the shelf</h2><p>Six sample items · inventory changes when you place an order</p></div><span class="badge">Local demo · INR</span></div><div class="toolbar"><input id="search" placeholder="Search notebooks, cables…"><select id="category"><option value="">All categories</option>${[...new Set(products.map(p=>p.category))].map(c=>`<option>${c}</option>`).join('')}</select><button class="btn ghost" id="clearSearch">Clear</button></div><div class="grid" id="productGrid">${productCards(products)}</div><div class="section-head"><div><h2>Your basket</h2><p>Review the items before checkout.</p></div></div><div class="layout"><div class="panel" id="cartPanel">${cartView()}</div><div class="panel"><h3>Price preview</h3><div class="total-line"><span>Items</span><span id="previewItems">${money(subtotal())}</span></div><div class="total-line"><span>Demo tax (5%)</span><span id="previewTax">${money(total()-subtotal())}</span></div><div class="total-line grand"><span>Total</span><span id="previewTotal">${money(total())}</span></div><p class="notice">Payment is simulated for this assignment. No bank or payment service is contacted.</p><button class="btn" id="checkoutBtn" style="width:100%">Continue to checkout</button></div></div>`}
function productCards(list){return list.map(p=>`<article class="product"><div class="product-art">${p.icon}</div><div><span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p>${esc(p.note)} · ${p.stock} available</p></div><div class="product-foot"><span class="price">${money(p.price)}</span><button class="btn small add" data-id="${p.id}" ${p.stock<1?'disabled':''}>Add</button></div></article>`).join('')||'<div class="empty">No shelf items match that search.</div>'}
function cartView(){let rows=cartItems();if(!rows.length)return '<div class="empty">Your basket is empty. Pick one or two things from the shelf above.</div>';return rows.map(({product:p,qty})=>`<div class="cart-row"><div class="grow"><strong>${esc(p.name)}</strong><div class="muted">${money(p.price)} each</div></div><div class="qty"><button class="minus" data-id="${p.id}">−</button><span>${qty}</span><button class="plus" data-id="${p.id}">+</button></div><strong>${money(p.price*qty)}</strong><button class="btn danger small remove" data-id="${p.id}" aria-label="Remove ${esc(p.name)}">×</button></div>`).join('')}
function ordersView(){let rows=db.orders.filter(o=>o.email===currentEmail).slice().reverse();if(!rows.length)return `<div class="section-head"><div><h2>My orders</h2><p>Orders and cancelled items stay in your history.</p></div></div><div class="panel empty">No orders yet. Your first campus basket will show up here.</div>`;return `<div class="section-head"><div><h2>My orders</h2><p>Orders and cancellations are kept as a simple, non-editable history.</p></div></div>${rows.map(o=>`<article class="panel"><div class="order-head"><div><span class="badge">${esc(o.id)}</span><strong style="margin-left:8px">${new Date(o.date).toLocaleDateString('en-IN')}</strong></div><span class="status">${esc(o.status)}</span></div><div class="muted" style="margin-top:8px">${o.items.map(i=>`${i.qty} × ${esc(i.name)}`).join(' · ')}</div><div class="progress">${['Placed','Packed','On the way','Delivered'].map((s,i)=>`<span class="step ${(o.status==='Cancelled'?i===0:i<=['Placed','Packed','On the way','Delivered'].indexOf(o.status))?'done':''}"></span>`).join('')}</div><div class="order-head"><span class="muted">To: ${esc(o.address)} · ${esc(o.payment)}</span><strong>${money(o.total)}</strong></div>${o.status==='Cancelled'?`<div class="notice">Demo refund recorded: ${money(o.refund||0)}. No real payment was made.</div>`:`<div class="order-head" style="margin-top:12px"><span class="muted">Estimated delivery: ${esc(o.eta)}</span><div><button class="btn ghost small track" data-id="${o.id}">Track order</button> ${o.status==='Placed'?`<button class="btn danger small cancel" data-id="${o.id}">Cancel</button>`:''}</div></div>`}</article>`).join('')}`}
function profileView(){let u=user();return `<div class="section-head"><div><h2>My profile</h2><p>Keep a name and delivery address ready for checkout.</p></div></div><div class="panel"><h3>Contact and delivery details</h3><div class="form-grid"><div class="field"><label for="profileName">Name</label><input id="profileName" value="${esc(u.name)}"></div><div class="field"><label for="profileEmail">Email</label><input id="profileEmail" value="${esc(u.email)}" disabled></div><div class="field"><label for="profilePhone">Phone (optional)</label><input id="profilePhone" value="${esc(u.phone)}" placeholder="10-digit mobile"></div><div class="field"><label for="profileAddress">Default address</label><input id="profileAddress" value="${esc(u.address)}" placeholder="Hostel or home address"></div></div><button class="btn" id="saveProfile">Save profile</button></div><div class="panel"><h3>Recent feedback</h3>${reviewsView()}</div><div class="panel"><h3>Password</h3><p class="muted">This demo keeps account data in this browser. The password is only for learning; do not reuse a real password.</p><button class="btn ghost" id="resetPass">Reset with demo OTP</button></div>`}
function reviewsView(){let rs=db.reviews.filter(r=>r.email===currentEmail).slice().reverse();return rs.length?rs.map(r=>`<div class="review"><span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span><span class="muted"> · ${new Date(r.date).toLocaleDateString('en-IN')}</span><div>${esc(r.text)}</div></div>`).join(''):'<p class="muted">No feedback yet. You can add a note in Help & feedback.</p>'}
function helpView(){return `<div class="section-head"><div><h2>Help & feedback</h2><p>Quick answers for this small demo shop.</p></div></div><div class="layout"><div class="panel"><h3>Common questions</h3><div class="faq"><strong>How is the total calculated?</strong><p>The prototype adds a 5% demo tax to the item subtotal. It does not connect to a payment gateway.</p></div><div class="faq"><strong>Can I cancel an order?</strong><p>Orders can be cancelled while their status is “Placed”. The prototype records the full amount as a demo refund.</p></div><div class="faq"><strong>Where is my parcel?</strong><p>Open My orders and choose Track order. The displayed progress is sample data, not live courier tracking.</p></div><div class="faq"><strong>Forgot your password?</strong><p>Use Reset with demo OTP in Profile. A sample code is shown in the app because no email service is connected.</p></div><div class="notice">This FAQ helper is a fixed set of answers. It is not an AI chatbot; a real support agent is not connected.</div><button class="btn ghost" id="humanHelp">Request human help</button><p id="humanMessage" class="muted"></p></div><div class="panel"><h3>Leave feedback</h3><p class="muted">A short note about the shelf or checkout would help improve the prototype.</p><div class="field"><label for="rating">Rating</label><select id="rating"><option value="5">5 - Very useful</option><option value="4">4 - Good</option><option value="3">3 - Okay</option><option value="2">2 - Needs work</option><option value="1">1 - Not useful</option></select></div><div class="field"><label for="reviewText">Your note</label><textarea id="reviewText" maxlength="240" placeholder="What worked well or felt confusing?"></textarea></div><button class="btn" id="sendReview">Save feedback</button></div></div>`}
function bind(){document.getElementById('browseBtn')?.addEventListener('click',()=>document.getElementById('search').focus());document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===b.dataset.id);if((db.cart[p.id]||0)>=p.stock)return toast('That is all the shelf has today.');db.cart[p.id]=(db.cart[p.id]||0)+1;save();render();toast(`${p.name} added to your basket.`)});let search=document.getElementById('search');search?.addEventListener('input',filter);document.getElementById('category')?.addEventListener('change',filter);document.getElementById('clearSearch')?.addEventListener('click',()=>{search.value='';document.getElementById('category').value='';filter()});document.querySelectorAll('.plus,.minus,.remove').forEach(b=>b.onclick=()=>changeCart(b.dataset.id,b.classList.contains('plus')?1:b.classList.contains('minus')?-1:0));document.getElementById('checkoutBtn')?.addEventListener('click',checkout);document.getElementById('saveProfile')?.addEventListener('click',saveProfile);document.getElementById('resetPass')?.addEventListener('click',forgot);document.getElementById('sendReview')?.addEventListener('click',sendReview);document.getElementById('humanHelp')?.addEventListener('click',()=>{document.getElementById('humanMessage').textContent='Demo request noted. Please contact your course demonstrator for real assistance.';toast('Your demo support request was noted.')});document.querySelectorAll('.track').forEach(b=>b.onclick=()=>track(b.dataset.id));document.querySelectorAll('.cancel').forEach(b=>b.onclick=()=>cancelOrder(b.dataset.id))}
function filter(){let q=document.getElementById('search').value.toLowerCase(),c=document.getElementById('category').value;document.getElementById('productGrid').innerHTML=productCards(products.filter(p=>(!c||p.category===c)&&(`${p.name} ${p.category} ${p.note}`).toLowerCase().includes(q)));document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===b.dataset.id);if((db.cart[p.id]||0)>=p.stock)return toast('That is all the shelf has today.');db.cart[p.id]=(db.cart[p.id]||0)+1;save();render();toast(`${p.name} added to your basket.`)})}
function changeCart(id,delta){let p=products.find(x=>x.id===id),n=(db.cart[id]||0)+delta;if(delta===0||n<=0)delete db.cart[id];else if(n<=p.stock)db.cart[id]=n;else toast('Quantity cannot be higher than available stock.');save();render()}
function modal(title,body,submitLabel,onSubmit){let root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-wrap"><section class="modal"><h2>${title}</h2>${body}<div class="modal-actions"><button class="btn subtle" id="closeModal">Close</button><button class="btn" id="submitModal">${submitLabel}</button></div></section></div>`;root.querySelector('.modal-wrap').onclick=e=>{if(e.target.classList.contains('modal-wrap'))root.innerHTML=''};document.getElementById('closeModal').onclick=()=>root.innerHTML='';document.getElementById('submitModal').onclick=onSubmit}
function checkout(){if(!cartItems().length)return toast('Add an item before checkout.');modal('Checkout',`<p class="muted">Confirm the delivery and choose a demo payment method.</p><div class="field"><label for="shipAddress">Delivery address</label><input id="shipAddress" value="${esc(user().address)}" placeholder="Hostel, room or home address"></div><div class="field"><label for="payMode">Payment method</label><select id="payMode"><option>UPI (demo)</option><option>Card (demo)</option><option>Cash on delivery (demo)</option></select></div><div class="total-line"><span>Subtotal + 5% demo tax</span><strong>${money(total())}</strong></div><p class="notice">No payment will be collected. “Place demo order” only records a sample transaction.</p>`,'Place demo order',placeOrder)}
function placeOrder(){let address=document.getElementById('shipAddress').value.trim();if(!address){toast('Enter a delivery address first.');return}for(let x of cartItems())if(x.qty>x.product.stock){toast(`${x.product.name} is no longer available in that quantity.`);return}let items=cartItems().map(x=>({id:x.product.id,name:x.product.name,price:x.product.price,qty:x.qty}));items.forEach(x=>products.find(p=>p.id===x.id).stock-=x.qty);db.lastOrder++;let o={id:'CB-'+String(db.lastOrder).padStart(4,'0'),email:currentEmail,items,subtotal:subtotal(),tax:Math.round(subtotal()*.05*100)/100,total:total(),address,payment:document.getElementById('payMode').value,status:'Placed',date:new Date().toISOString(),eta:new Date(Date.now()+2*86400000).toLocaleDateString('en-IN')};db.orders.push(o);db.users[currentEmail].address=address;db.cart={};save();document.getElementById('modalRoot').innerHTML='';setView('orders');toast(`Demo order ${o.id} placed.`)}
function track(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let text=o.status==='Placed'?'The shop has received the order.':o.status==='Packed'?'Your parcel is packed and waiting for pickup.':o.status==='On the way'?'The parcel is with the demo delivery partner.':o.status==='Delivered'?'The parcel is marked delivered.':'This order was cancelled.';modal(`Track ${o.id}`,`<p>${esc(text)}</p><p class="muted">Estimated delivery: ${esc(o.eta)}. Status is sample information for this classroom model.</p>`,'Got it',()=>document.getElementById('modalRoot').innerHTML='')}
function cancelOrder(id){let o=db.orders.find(x=>x.id===id);if(!o||o.status!=='Placed')return toast('Only a newly placed order can be cancelled in this demo.');modal(`Cancel ${o.id}`,`<p>Cancel this order and record a demo refund of <strong>${money(o.total)}</strong>?</p><p class="muted">The transaction will remain in your purchase history.</p>`,'Confirm cancellation',()=>{o.status='Cancelled';o.refund=o.total;o.items.forEach(i=>{let p=products.find(x=>x.id===i.id);if(p)p.stock+=i.qty});save();document.getElementById('modalRoot').innerHTML='';render();toast('Order cancelled; demo refund added to history.')})}
function saveProfile(){let name=document.getElementById('profileName').value.trim(),phone=document.getElementById('profilePhone').value.trim(),address=document.getElementById('profileAddress').value.trim();if(!name)return toast('Name cannot be empty.');if(phone&&!/^\d{10}$/.test(phone))return toast('Enter a 10-digit phone number or leave it blank.');Object.assign(user(),{name,phone,address});save();render();toast('Profile saved.')}
function sendReview(){let text=document.getElementById('reviewText').value.trim(),stars=Number(document.getElementById('rating').value);if(!text)return toast('Add a short note before saving.');db.reviews.push({email:currentEmail,text,stars,date:new Date().toISOString()});save();document.getElementById('reviewText').value='';toast('Feedback saved.');}
function forgot(){modal('Reset password',`<p class="muted">For this classroom prototype, a one-time code is generated locally and shown here. No email or SMS is sent.</p><div class="field"><label for="otp">Demo OTP</label><input id="otp" inputmode="numeric" maxlength="6"></div><p class="notice">Your demo code is <strong id="demoOtp"></strong></p><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" placeholder="At least 8 characters, one letter and one number"></div>`,'Verify and reset',()=>{let code=document.getElementById('demoOtp').textContent,pw=document.getElementById('newPassword').value;if(document.getElementById('otp').value!==code)return toast('That demo code is not correct.');if(!validPassword(pw))return toast('Use 8+ characters with a letter and a number.');user().password=pw;save();document.getElementById('modalRoot').innerHTML='';toast('Password reset in this browser.')});document.getElementById('demoOtp').textContent=String(Math.floor(100000+Math.random()*900000))}
function validPassword(p){return p.length>=8&&/[A-Za-z]/.test(p)&&/\d/.test(p)}
function signIn(){modal('Sign in to Campus Basket',`<p class="muted">Demo account: student@campus.test · Campus123</p><div class="field"><label for="loginEmail">Email</label><input id="loginEmail" value="student@campus.test"></div><div class="field"><label for="loginPass">Password</label><input id="loginPass" type="password" value="Campus123"></div><button class="btn ghost small" id="createAccount">Create account</button> <button class="btn ghost small" id="forgotLogin">Forgot password</button>`,'Sign in',()=>{let e=document.getElementById('loginEmail').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;if(!db.users[e]||db.users[e].password!==p)return toast('Email or password did not match.');currentEmail=e;document.getElementById('modalRoot').innerHTML='';render();toast('Signed in.')});document.getElementById('createAccount').onclick=register;document.getElementById('forgotLogin').onclick=forgot}
function register(){modal('Create a student account',`<div class="field"><label for="regName">Name</label><input id="regName"></div><div class="field"><label for="regEmail">Email</label><input id="regEmail" type="email"></div><div class="field"><label for="regPass">Password</label><input id="regPass" type="password" placeholder="8+ characters, a letter and a number"></div><p class="notice">Registration is stored in this browser for the demo. A real email verification service is not connected.</p>`,'Create account',()=>{let n=document.getElementById('regName').value.trim(),e=document.getElementById('regEmail').value.trim().toLowerCase(),p=document.getElementById('regPass').value;if(!n||!e.includes('@')||!validPassword(p))return toast('Enter a name, valid email and a stronger password.');if(db.users[e])return toast('An account with that email already exists.');db.users[e]={name:n,email:e,password:p,phone:'',address:''};currentEmail=e;save();document.getElementById('modalRoot').innerHTML='';render();toast('Account created in this browser.')})}
render();
</script>
</body>
</html>
